[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-datos-oficiales-peru"
version = "0.1.0"
description = "Agente de investigacion socioeconomica con datos oficiales del Peru"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2,<4",
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24",
    "pyarrow>=18",
    "pyproj>=3.6,<3.8",
    "pyreadstat>=1.3.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# cryptography 49+ no ofrece wheels para macOS Intel y requiere OpenSSL al compilar.
constraint-dependencies = ["cryptography<49"]
